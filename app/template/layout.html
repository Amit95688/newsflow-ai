<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f8f9fb;
                color: #1f2937;
            }

            .container {
                max-width: 1100px;
                margin: 0 auto;
                padding: 20px;
            }

            h1 {
                margin-bottom: 8px;
            }

            .muted {
                color: #6b7280;
                margin-bottom: 20px;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .card {
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                padding: 16px;
                margin-bottom: 12px;
            }

            .story-title {
                margin: 0 0 8px;
                font-size: 18px;
            }

            .meta {
                color: #4b5563;
                font-size: 14px;
                margin-bottom: 10px;
            }

            .summary {
                line-height: 1.5;
                white-space: pre-wrap;
            }

            a {
                color: #2563eb;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            @media (max-width: 900px) {
                .grid {
                    grid-template-columns: 1fr;
                }
            }
            body {
                font-family: sans-serif;
            }

        </style>
    </head>
    <body>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
